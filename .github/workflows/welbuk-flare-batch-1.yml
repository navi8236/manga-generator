name: Welbuk Manga Pages 01-08 — Flare
on:
  push:
    branches:
      - comic/welbuk-onboarding
    paths:
      - scripts/welbuk-flare-batch-1.mjs

permissions:
  contents: read
concurrency:
  group: welbuk-flare-batch-1
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate eight Welbuk manga page illustrations (no extra variants)
        env:
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
        run: node scripts/welbuk-flare-batch-1.mjs
      - name: Letter and package generated pages
        if: always()
        run: |
          python -m pip install Pillow
          if [ -f output/welbuk-flare-batch-1/manifest.json ]; then
            python scripts/assemble-welbuk-flare-batch-1.py
          fi
      - name: Upload pages and generation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welbuk-manga-flare-pages-01-08
          path: output/welbuk-flare-batch-1/
          if-no-files-found: warn
          retention-days: 30
