t-size="26" fill="black">prior health info · </text><text x="58" y="424" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">allergy panel · </text><text x="58" y="456" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">AI mic on · </text><text x="58" y="488" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">patient docs · lab reports</text><text x="36" y="530" font-size="18" fill="#666">1 / Ananya greets Ravi; the laptop opens on patient details</text><rect x="144" y="718" width="80" height="95" fill="#f5f5f5" stroke="#bbb"/><circle cx="184" cy="794" r="5" fill="#999"/><text x="194" y="794" font-size="18">ananya</text><rect x="824" y="708" width="80" height="95" fill="#f5f5f5" stroke="#bbb"/><circle cx="864" cy="784" r="5" fill="#999"/><text x="874" y="784" font-size="18">ravi</text><rect x="24" y="568" width="976" height="330" fill="none" stroke="black" stroke-width="3"/><rect x="40" y="584" width="332" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 192.1283347048603 686.038702333497 L 195.4823109744879 712.0580535002455 L 206.1283347048603 686.038702333497 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="724" y="584" width="199" height="74" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 824.7287137504452 654.1180331190758 L 843.6697577422323 702.1770496786137 L 838.7287137504452 654.1180331190758 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="354" y="738" width="369" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><path data-speaker="ananya" d="M 192.1283347048603 686.038702333497 L 195.4823109744879 712.0580535002455 L 206.1283347048603 686.038702333497" fill="white" stroke="black" stroke-width="2"/><rect x="40" y="584" width="332" height="106" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="58" y="618" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">May the AI listen and </text><text x="58" y="650" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">save notes of our talk?</text><path data-speaker="ravi" d="M 824.7287137504452 654.1180331190758 L 843.6697577422323 702.1770496786137 L 838.7287137504452 654.1180331190758" fill="white" stroke="black" stroke-width="2"/><rect x="724" y="584" width="199" height="74" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="742" y="618" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Yes, I agree.</text><rect x="354" y="738" width="369" height="138" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="372" y="772" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">AI VOICE CONSENT: </text><text x="372" y="804" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">asked at the first visit, </text><text x="372" y="836" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">before any voice is saved</text><text x="36" y="884" font-size="18" fill="#666">2 / First-time AI voice consent</text><rect x="354" y="1062" width="110" height="130" fill="#f5f5f5" stroke="#bbb"/><circle cx="409" cy="1166" r="5" fill="#999"/><text x="419" y="1166" font-size="18">ravi</text><rect x="24" y="922" width="560" height="542" fill="none" stroke="black" stroke-width="3"/><rect x="40" y="938" width="257" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 231.10278017523572 1041.6465136410238 L 349.1484559771393 1122.4489804407458 L 245.10278017523572 1041.6465136410238 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="40" y="1212" width="340" height="234" rx="34" fill="white" stroke="white" stroke-width="6"/><path data-speaker="ravi" d="M 231.10278017523572 1041.6465136410238 L 349.1484559771393 1122.4489804407458 L 245.10278017523572 1041.6465136410238" fill="white" stroke="black" stroke-width="2"/><rect x="40" y="938" width="257" height="106" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="58" y="972" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">I&apos;ve been feeling </text><text x="58" y="1004" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">tired lately.</text><rect x="40" y="1212" width="340" height="234" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="58" y="1246" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">SOAP NOTES: </text><text x="58" y="1278" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">fill in manually and </text><text x="58" y="1310" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">choose ICD or SNOMED </text><text x="58" y="1342" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">codes, or let AI listen </text><text x="58" y="1374" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">and summarise the </text><text x="58" y="1406" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">conversation</text><text x="36" y="1450" font-size="18" fill="#666">3 / Ravi shares a routine concern; SOAP notes listen</text><rect x="748" y="1172" width="110" height="130" fill="#f5f5f5" stroke="#bbb"/><circle cx="803" cy="1276" r="5" fill="#999"/><text x="813" y="1276" font-size="18">ananya</text><rect x="608" y="922" width="392" height="542" fill="none" stroke="black" stroke-width="3"/><rect x="624" y="938" width="311" height="170" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="624" y="938" width="311" height="170"  fill="white" stroke="black" stroke-width="2"/><text x="642" y="972" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Technology supports </text><text x="642" y="1004" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">the workflow. The </text><text x="642" y="1036" font-family="Meiryo,MS Gothic,sans-serif" fon