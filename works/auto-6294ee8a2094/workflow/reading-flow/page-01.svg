="138" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="62" y="706" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Appointments, </text><text x="62" y="738" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">patient details, </text><text x="62" y="770" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">follow-ups...</text><path data-speaker="meera" d="M 401.023353051003 902.2834153586635 L 393.2444536602742 939.4251230379953 L 415.023353051003 902.2834153586635" fill="white" stroke="black" stroke-width="2"/><rect x="304" y="768" width="260" height="138" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="322" y="802" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">I wish everything </text><text x="322" y="834" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">were easier </text><text x="322" y="866" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">to manage!</text><text x="36" y="1450" font-size="18" fill="#666">2 / Meera is overwhelmed by paper registers and calls</text><rect x="855" y="945" width="72" height="90" fill="#f5f5f5" stroke="#bbb"/><circle cx="882" cy="1022" r="5" fill="#999"/><text x="892" y="1022" font-size="18">ananya</text><rect x="680" y="1080" width="45" height="55" fill="#f5f5f5" stroke="#bbb"/><circle cx="703" cy="1125" r="5" fill="#999"/><text x="713" y="1125" font-size="18">meera</text><rect x="608" y="648" width="392" height="816" fill="none" stroke="black" stroke-width="3"/><rect x="626" y="672" width="255" height="170" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 785.9717204910535 838.4008243589817 L 852.3821090384669 960.9203026863325 L 799.9717204910535 838.4008243589817 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><path data-speaker="ananya" d="M 785.9717204910535 838.4008243589817 L 852.3821090384669 960.9203026863325 L 799.9717204910535 838.4