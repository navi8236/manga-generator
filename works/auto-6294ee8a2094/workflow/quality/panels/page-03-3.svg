0" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Of course. May I </text><text x="662" y="102" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">register your details </text><text x="662" y="134" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">for today&apos;s </text><text x="662" y="166" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">appointment?</text><image href="../../../assets/panels/03-3.png" x="24" y="608" width="976" height="460" preserveAspectRatio="xMidYMid meet"/><rect x="24" y="608" width="976" height="460" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="624" width="191" height="74" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 170.6741581282974 695.7237030856154 L 233.06628306400575 734.0585705014389 L 184.6741581282974 695.7237030856154 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><path data-speaker="ravi" d="M 170.6741581282974 695.7237030856154 L 233.06628306400575 734.0585705014389 L 184.6741581282974 695.7237030856154" fill="white" stroke="black" stroke-width="2"/><rect x="32" y="624" width="191" height="74" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="50" y="658" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Yes, please.</text><image href="../../../assets/panels/03-4.png" x="24" y="1092" width="976" height="372" preserveAspectRatio="xMidYMid meet"/><rect x="24" y="1092" width="976" height="372" fill="none" stroke="black" stroke-width="3"/><rect x="464" y="1100" width="295" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 677.7896487882584 1203.7236261368328 L 757.0663629461673 1253.7462021480285 L 691.7896487882584 1203.7236261368328 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><path data-speaker="meera" d="M 677.7896487882584 1203.7236261368328 L 757.0663629461673 1253.7462021480285 L 691.7896487882584 