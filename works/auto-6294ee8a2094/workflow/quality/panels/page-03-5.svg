c,sans-serif" font-size="26" fill="black">Ravi scans </text><text x="58" y="570" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">the QR code </text><text x="58" y="602" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">at the door.</text><image href="../../../assets/panels/03-4.png" x="512" y="488" width="488" height="440" preserveAspectRatio="xMidYMid meet"/><rect x="512" y="488" width="488" height="440" fill="none" stroke="black" stroke-width="3"/><rect x="528" y="504" width="297" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="528" y="504" width="297" height="138"  fill="white" stroke="black" stroke-width="2"/><text x="546" y="538" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">A short form on </text><text x="546" y="570" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">his own phone, </text><text x="546" y="602" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">shared with consent.</text><image href="../../../assets/panels/03-5.png" x="24" y="952" width="976" height="512" preserveAspectRatio="xMidYMid meet"/><rect x="24" y="952" width="976" height="512" fill="none" stroke="black" stroke-width="3"/><rect x="40" y="968" width="304" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="664" y="1012" width="305" height="74" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="40" y="968" width="304" height="106"  fill="white" stroke="black" stroke-width="2"/><text x="58" y="1002" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Every check-in gets </text><text x="58" y="1034" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">a slot on the screen.</text><rect x="664" y="1012" width="305" height="74" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="682" y="1046" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">A-10 · A-11 · A-