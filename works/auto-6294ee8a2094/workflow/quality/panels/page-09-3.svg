<svg xmlns="http://www.w3.org/2000/svg" width="476" height="380" viewBox="24 548 476 380"><rect width="1024" height="1536" fill="white"/><image href="../../../assets/panels/09-1.png" x="24" y="24" width="476" height="500" preserveAspectRatio="xMidYMid meet"/><rect x="24" y="24" width="476" height="500" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="26" width="465" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="32" y="168" width="203" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="32" y="26" width="465" height="138"  fill="white" stroke="black" stroke-width="2"/><text x="50" y="60" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Welbuk Practice sends Ravi&apos;s </text><text x="50" y="92" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">follow-up reminder on WhatsApp. </text><text x="50" y="124" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">No calls from the front desk.</text><rect x="32" y="168" width="203" height="106" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="50" y="202" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">FOLLOW-UP </text><text x="50" y="234" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">REMINDER</text><image href="../../../assets/panels/09-2.png" x="524" y="24" width="476" height="500" preserveAspectRatio="xMidYMid meet"/><rect x="524" y="24" width="476" height="500" fill="none" stroke="black" stroke-width="3"/><rect x="532" y="28" width="438" height="170" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="532" y="28" width="438" height="170"  fill="white" stroke="black" stroke-width="2"/><text x="550" y="62" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">On the day, Ravi arrives </text><text x="550" y="94" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">empty-handed. No files to find, </text><text x="550" y="126" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">no reports to re-enter: </text><text x="550" y="158" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Welbuk already has them.</text><image href="../../../assets/panels/09-3.png" x="24" y="548" width="476" height="380" preserveAspectRatio="xMidYMid meet"/><rect x="24" y="548" width="476" height="380" fill="none" stroke="black" stroke-width="3"/><rect x="32" y="744" width="206" height="170" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="32" y="744" width="206" height="170"  fill="white" stroke="black" stroke-width="2"/><text x="50" y="778" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">He checks in </text><text x="50" y="810" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">himself. </text><text x="50" y="842" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">No queue </text><text x="50" y="874" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">at the desk.</text><image href="../../../assets/panels/09-4.png" x="524" y="548" width="476" height="380" preserveAspectRatio="xMidYMid meet"/><rect x="524" y="548" width="476" height="380" fill="none" stroke="black" stroke-width="3"/><rect x="524" y="548" width="218" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="802" y="586" width="190" height="74" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="524" y="548" width="218" height="138"  fill="white" stroke="black" stroke-width="2"/><text x="542" y="582" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">As usual, his </text><text x="542" y="614" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">slot comes up </text><text x="542" y="646" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">on the screen.</text><rect x="802" y="586" width="190" height="74" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="820" y="620" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">NOW · A-31</text><image href="../../../assets/panels/09-5.png" x="24" y="952" width="976" height="512" preserveAspectRatio="xMidYMid meet"/><rect x="24" y="952" width="976" height="512" fill="none" stroke="black" stroke-width="3"/><rect x="385" y="962" width="296" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 388.79835231195085 1071.6072425381597 L 369.6975284679263 1084.9132561517372 L 388.79835231195085 1085.6072425381597 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="40" y="1356" width="780" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><path data-speaker="ananya" d="M 388.79835231195085 1071.6072425381597 L 369.6975284679263 1084.9132561517372 L 388.79835231195085 1085.6072425381597" fill="white" stroke="black" stroke-width="2"/><rect x="385" y="962" width="296" height="138" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="403" y="996" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Welcome back, Ravi. </text><text x="403" y="1028" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Your results are </text><text x="403" y="1060" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">already here.</text><rect x="40" y="1356" width="780" height="106"  fill="white" stroke="black" stroke-width="2"/><text x="58" y="1390" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Fewer missed follow-ups, shorter visits, less paperwork. </text><text x="58" y="1422" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">The clinic&apos;s time goes to patients.</text><text x="512" y="1500" text-anchor="middle" font-family="sans-serif" font-size="20">9</text></svg>