<svg xmlns="http://www.w3.org/2000/svg" width="976" height="520" viewBox="24 24 976 520"><rect width="1024" height="1536" fill="white"/><image href="../../../assets/panels/05-1.png" x="24" y="24" width="976" height="520" preserveAspectRatio="xMidYMid meet"/><rect x="24" y="24" width="976" height="520" fill="none" stroke="black" stroke-width="3"/><rect x="514" y="40" width="211" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 517.4619315001713 161.0592832004739 L 485.192897250257 186.7364892706249 L 517.4619315001713 175.0592832004739 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="34" y="224" width="292" height="266" rx="34" fill="white" stroke="white" stroke-width="6"/><path data-speaker="ananya" d="M 517.4619315001713 161.0592832004739 L 485.192897250257 186.7364892706249 L 517.4619315001713 175.0592832004739" fill="white" stroke="black" stroke-width="2"/><rect x="514" y="40" width="211" height="138" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="532" y="74" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Hello, Ravi. </text><text x="532" y="106" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Tell me what </text><text x="532" y="138" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">brings you in.</text><rect x="34" y="224" width="292" height="266" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="52" y="258" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">PATIENT DETAILS: </text><text x="52" y="290" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">current vitals · </text><text x="52" y="322" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">prior health info · </text><text x="52" y="354" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">allergy panel · </text><text x="52" y="386" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">AI mic option · </text><text x="52" y="418" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">patient docs · </text><text x="52" y="450" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">lab reports</text><image href="../../../assets/panels/05-2.png" x="24" y="568" width="976" height="330" preserveAspectRatio="xMidYMid meet"/><rect x="24" y="568" width="976" height="330" fill="none" stroke="black" stroke-width="3"/><rect x="64" y="572" width="332" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 244.18233805754568 674.3245871911421 L 278.7366972703676 738.4868807867131 L 258.1823380575457 674.3245871911421 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="400" y="572" width="199" height="74" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 534.2420309769146 643.4537398539612 L 667.7226070772624 747.8504058415499 L 548.2420309769146 643.4537398539612 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="625" y="572" width="369" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><path data-speaker="ananya" d="M 244.18233805754568 674.3245871911421 L 278.7366972703676 738.4868807867131 L 258.1823380575457 674.3245871911421" fill="white" stroke="black" stroke-width="2"/><rect x="64" y="572" width="332" height="106" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="82" y="606" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">May the AI listen and </text><text x="82" y="638" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">save notes of our talk?</text><path data-speaker="ravi" d="M 534.2420309769146 643.4537398539612 L 667.7226070772624 747.8504058415499 L 548.2420309769146 643.4537398539612" fill="white" stroke="black" stroke-width="2"/><rect x="400" y="572" width="199" height="74" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="418" y="606" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Yes, I agree.</text><rect x="625" y="572" width="369" height="138" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="643" y="606" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">AI VOICE CONSENT: </text><text x="643" y="638" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">asked at the first visit, </text><text x="643" y="670" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">before any voice is saved</text><image href="../../../assets/panels/05-3.png" x="24" y="922" width="560" height="542" preserveAspectRatio="xMidYMid meet"/><rect x="24" y="922" width="560" height="542" fill="none" stroke="black" stroke-width="3"/><rect x="40" y="938" width="257" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 293.1278133993377 1016.2845383282094 L 387.19172009900655 1047.651569397076 L 293.1278133993377 1030.2845383282095 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="26" y="1160" width="248" height="298" rx="34" fill="white" stroke="white" stroke-width="6"/><path data-speaker="ravi" d="M 293.1278133993377 1016.2845383282094 L 387.19172009900655 1047.651569397076 L 293.1278133993377 1030.2845383282095" fill="white" stroke="black" stroke-width="2"/><rect x="40" y="938" width="257" height="106" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="58" y="972" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">I&apos;ve been feeling </text><text x="58" y="1004" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">tired lately.</text><rect x="26" y="1160" width="248" height="298" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="44" y="1194" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">SOAP NOTES: </text><text x="44" y="1226" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">fill in </text><text x="44" y="1258" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">manually and </text><text x="44" y="1290" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">choose ICD or </text><text x="44" y="1322" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">SNOMED codes, </text><text x="44" y="1354" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">or let AI listen </text><text x="44" y="1386" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">and summarise </text><text x="44" y="1418" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">the conversation</text><image href="../../../assets/panels/05-4.png" x="608" y="922" width="392" height="542" preserveAspectRatio="xMidYMid meet"/><rect x="608" y="922" width="392" height="542" fill="none" stroke="black" stroke-width="3"/><rect x="620" y="934" width="311" height="170" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="620" y="934" width="311" height="170"  fill="white" stroke="black" stroke-width="2"/><text x="638" y="968" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Technology supports </text><text x="638" y="1000" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">the workflow. The </text><text x="638" y="1032" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">conversation stays </text><text x="638" y="1064" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">human.</text><text x="512" y="1500" text-anchor="middle" font-family="sans-serif" font-size="20">5</text></svg>