thic,sans-serif" font-size="26" fill="black">As usual, his </text><text x="542" y="614" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">slot comes up </text><text x="542" y="646" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">on the screen.</text><rect x="802" y="586" width="190" height="74" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="820" y="620" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">NOW · A-31</text><rect x="279" y="1017" width="85" height="105" fill="#f5f5f5" stroke="#bbb"/><circle cx="324" cy="1100" r="5" fill="#999"/><text x="334" y="1100" font-size="18">ananya</text><rect x="704" y="1012" width="95" height="110" fill="#f5f5f5" stroke="#bbb"/><circle cx="736" cy="1092" r="5" fill="#999"/><text x="746" y="1092" font-size="18">ravi</text><rect x="24" y="952" width="976" height="512" fill="none" stroke="black" stroke-width="3"/><rect x="385" y="962" width="296" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 388.79835231195085 1071.6072425381597 L 369.6975284679263 1084.9132561517372 L 388.79835231195085 1085.6072425381597 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="40" y="1356" width="780" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><path data-speaker="ananya" d="M 388.79835231195085 1071.6072425381597 L 369.6975284679263 1084.9132561517372 L 388.79835231195085 1085.6072425381597" fill="white" stroke="black" stroke-width="2"/><rect x="385" y="962" width="296" height="138" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="403" y="996" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Welcome back, Ravi. </text><text x="403" y="1028" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Your results are </text><text x="403" y="1060" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">already here.</text><rect x=