y the AI listen and </text><text x="82" y="638" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">save notes of our talk?</text><path data-speaker="ravi" d="M 531.032903907909 643.4810178674363 L 665.4283491781439 746.7592853025487 L 545.032903907909 643.4810178674363" fill="white" stroke="black" stroke-width="2"/><rect x="396" y="572" width="199" height="74" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="414" y="606" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Yes, I agree.</text><rect x="631" y="572" width="369" height="138" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="649" y="606" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">AI VOICE CONSENT: </text><text x="649" y="638" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">asked at the first visit, </text><text x="649" y="670" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">before any voice is saved</text><rect x="393" y="979" width="96" height="112" fill="#f5f5f5" stroke="#bbb"/><circle cx="431" cy="1059" r="5" fill="#999"/><text x="441" y="1059" font-size="18">ravi</text><rect x="24" y="922" width="560" height="542" fill="none" stroke="black" stroke-width="3"/><rect x="40" y="938" width="257" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><path d="M 293.1278133993377 1016.2845383282094 L 387.19172009900655 1047.651569397076 L 293.1278133993377 1030.2845383282095 Z" fill="white" stroke="white" stroke-width="6" stroke-linejoin="round"/><rect x="26" y="1160" width="248" height="298" rx="34" fill="white" stroke="white" stroke-width="6"/><path data-speaker="ravi" d="M 293.1278133993377 1016.2845383282094 L 387.19172009900655 1047.651569397076 L 293.1278133993377 1030.2845383282095" fill="white" stroke="black" stroke-width="2"/><rect x="40" y="938" width="257" height="106" rx="34" fill="white" stroke="black" stroke-width="2"/><text x="58" y="972" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">I&apos;ve been feeling </text><text x="58" y="1004" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">tired lately.</text><rect x="26" y="1160" width="248" height="298" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="44" y="1194" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">SOAP NOTES: </text><text x="44" y="1226" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">fill in </text><text x="44" y="1258" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">manually and </text><text x="44" y="1290" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">choose ICD or </text><text x="44" y="1322" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">SNOMED codes, </text><text x="44" y="1354" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">or let AI listen </text><text x="44" y="1386" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">and summarise </text><text x="44" y="1418" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">the conversation</text><rect x="762" y="1161" width="75" height="90" fill="#f5f5f5" stroke="#bbb"/><circle cx="808" cy="1234" r="5" fill="#999"/><text x="818" y="1234" font-size="18">ananya</text><circle cx="957" cy="1193" r="5" fill="#999"/><text x="967" y="1193" font-size="18">ravi</text><rect x="608" y="922" width="392" height="542" fill="none" stroke="black" stroke-width="3"/><rect x="620" y="934" width="311" height="170" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="620" y="934" width="311" height="170"  fill="white" stroke="black" stroke-width="2"/><text x="638" y="968" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Technology supports </text><text x="638" y="1000" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">the workflow. The </t