<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536"><rect width="1024" height="1536" fill="white"/><rect x="156" y="189" width="50" height="64" fill="#f5f5f5" stroke="#bbb"/><circle cx="183" cy="246" r="5" fill="#999"/><text x="193" y="246" font-size="18">raman</text><rect x="333" y="207" width="50" height="66" fill="#f5f5f5" stroke="#bbb"/><circle cx="354" cy="262" r="5" fill="#999"/><text x="364" y="262" font-size="18">meera</text><rect x="24" y="24" width="488" height="440" fill="none" stroke="black" stroke-width="3"/><rect x="40" y="40" width="373" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="40" y="40" width="373" height="138"  fill="white" stroke="black" stroke-width="2"/><text x="58" y="74" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">A later morning: </text><text x="58" y="106" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">patients can always check </text><text x="58" y="138" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">in at the front desk.</text><text x="36" y="450" font-size="18" fill="#666">1 / Front-desk check-in with Meera</text><rect x="728" y="153" width="76" height="80" fill="#f5f5f5" stroke="#bbb"/><circle cx="766" cy="219" r="5" fill="#999"/><text x="776" y="219" font-size="18">priya</text><rect x="536" y="24" width="464" height="440" fill="none" stroke="black" stroke-width="3"/><rect x="552" y="28" width="354" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="552" y="28" width="354" height="106"  fill="white" stroke="black" stroke-width="2"/><text x="570" y="62" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Some check in ahead </text><text x="570" y="94" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">on the Welbuk Health app.</text><text x="548" y="450" font-size="18" fill="#666">2 / Priya checks in ahead on the Welbuk Health app</text><rect x="287" y="612" width="94" height="100" fill="#f5f5f5" stroke="#bbb"/><circle cx="327" cy="685" r="5" fill="#999"/><text x="337" y="685" font-size="18">ravi</text><rect x="24" y="488" width="464" height="440" fill="none" stroke="black" stroke-width="3"/><rect x="40" y="504" width="273" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="40" y="504" width="273" height="106"  fill="white" stroke="black" stroke-width="2"/><text x="58" y="538" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Ravi scans the QR </text><text x="58" y="570" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">code at the door.</text><text x="36" y="914" font-size="18" fill="#666">3 / Ravi scans the QR code at the door</text><rect x="844" y="580" width="91" height="180" fill="#f5f5f5" stroke="#bbb"/><circle cx="876" cy="692" r="5" fill="#999"/><text x="886" y="692" font-size="18">ravi</text><rect x="512" y="488" width="488" height="440" fill="none" stroke="black" stroke-width="3"/><rect x="528" y="504" width="297" height="138" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="528" y="504" width="297" height="138"  fill="white" stroke="black" stroke-width="2"/><text x="546" y="538" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">A short form on </text><text x="546" y="570" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">his own phone, </text><text x="546" y="602" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">shared with consent.</text><text x="524" y="914" font-size="18" fill="#666">4 / He fills a short form on his phone</text><rect x="166" y="1129" width="97" height="97" fill="#f5f5f5" stroke="#bbb"/><circle cx="235" cy="1206" r="5" fill="#999"/><text x="245" y="1206" font-size="18">raman</text><rect x="384" y="1150" width="90" height="90" fill="#f5f5f5" stroke="#bbb"/><circle cx="447" cy="1220" r="5" fill="#999"/><text x="457" y="1220" font-size="18">priya</text><rect x="561" y="1129" width="94" height="97" fill="#f5f5f5" stroke="#bbb"/><circle cx="634" cy="1199" r="5" fill="#999"/><text x="644" y="1199" font-size="18">ravi</text><rect x="24" y="952" width="976" height="512" fill="none" stroke="black" stroke-width="3"/><rect x="40" y="968" width="304" height="106" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="664" y="1012" width="305" height="74" rx="34" fill="white" stroke="white" stroke-width="6"/><rect x="40" y="968" width="304" height="106"  fill="white" stroke="black" stroke-width="2"/><text x="58" y="1002" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">Every check-in gets </text><text x="58" y="1034" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">a slot on the screen.</text><rect x="664" y="1012" width="305" height="74" rx="10" fill="#e6f4f3" stroke="#1d6f6a" stroke-width="3"/><text x="682" y="1046" font-family="Meiryo,MS Gothic,sans-serif" font-size="26" fill="black">A-10 · A-11 · A-12</text><text x="36" y="1450" font-size="18" fill="#666">5 / All three get slots on the screen</text><text x="512" y="1500" text-anchor="middle" font-family="sans-serif" font-size="20">3</text></svg>