at is available to you. / A smoother visit. A more connected experience."},{"id":"08","alt":"Meanwhile, the pharmacy is notified and fills the prescription. / NEW PRESCRIPTION / The lab is notified. / LAB ORDER: samples to collect / Later that day, Ravi gives his samples at the clinic lab. / All done, Ravi! We'll let you know when your results are ready. / Results ready: Ravi is notified. / Welbuk Health app · email · WhatsApp / Dr. Ananya is notified on Welbuk Care. / RESULTS READY / The clinic is notified on Welbuk Practice. / RESULTS READY"},{"id":"09","alt":"Welbuk Practice sends Ravi's follow-up reminder on WhatsApp. No calls from the front desk. / FOLLOW-UP REMINDER / On the day, Ravi arrives empty-handed. No files to find, no reports to re-enter: Welbuk already has them. / He checks in himself. No queue at the desk. / As usual, his slot comes up on the screen. / NOW · A-31 / Welcome back, Ravi. Your results are already here. / Fewer missed follow-ups, shorter visits, less paperwork. The clinic's time goes to patients."},{"id":"10","alt":"If Ravi travels, his record travels with him. / WELBUK VISION / Trusted clinics in the network can continue his care if needed, and gain referred patients. / WELBUK VISION / One connected ecosystem for care and family wellness. / Welbuk Practice • Welbuk Care • Welbuk Health / Welbuk — Building a connected healthcare ecosystem."}];
let current=0;
const image=document.getElementById('page'),next=document.getElementById('next'),prev=document.getElementById('prev'),position=document.getElementById('position');
